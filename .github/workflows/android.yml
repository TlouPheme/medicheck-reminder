name: Android CI

# Builds the app and runs the unit tests on every push (any branch) and on every pull request,
# so a feature branch shows red or green before it is merged into main.
on:
  push:
  pull_request:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle downloads and build outputs between runs.
      # https://github.com/gradle/actions/blob/main/docs/setup-gradle.md
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Puts sdkmanager on the PATH and accepts the SDK licenses.
      # https://github.com/android-actions/setup-android
      # The default package list includes the retired 'tools' package, so only the platform is named.
      # compileSdk 37 is published as 'platforms;android-37.0'.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.0

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # google-services.json is not committed, so this build has Google sign-in switched off.
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble the debug app
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: medicheck-debug-apk
          path: app/build/outputs/apk/debug/*.apk
